<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tara OTP Login</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div class="container">
    <div class="card">
        <h1>OTP Login</h1>
        <p>Use your mobile number to receive an OTP, then verify it to enroll a device-bound passkey.</p>
        <div class="grid">
            <div>
                <label for="mobileNumber">Mobile Number</label>
                <input id="mobileNumber" placeholder="+6281250049013" />
                <button id="sendOtp">Send OTP</button>
                <div class="status" id="sendStatus"></div>
            </div>
            <div>
                <label for="otp">OTP</label>
                <input id="otp" placeholder="Enter OTP" />
                <button class="secondary" id="verifyOtp">Verify OTP</button>
                <div class="status" id="verifyStatus"></div>
            </div>
        </div>
    </div>
</div>
<script type="module" th:src="@{/js/otp.js}"></script>
</body>
</html>
