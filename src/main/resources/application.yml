server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: strict
        secure: false

spring:
  datasource:
    url: jdbc:h2:mem:passkeydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  crypto:
    key-store-path: keystore.p12
    key-store-password: changeit
    key-alias: tara-rsa
  webauthn:
    rp-id: localhost
    rp-name: Tara
    origins:
      - http://localhost:8080
  otp:
    base-url: https://dev.tara.app
    access-key: ""
